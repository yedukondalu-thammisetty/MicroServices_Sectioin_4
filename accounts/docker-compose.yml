services:
 accounts:
   image: "tyedukondaluy/accounts:s4"
   container_name: accounts-ms
   ports:
      - "8080:8080"
   deploy:
    resources:
      limits:
        memory: 400m
   networks:
     - tykrohit

 loans:
   image: "tyedukondaluy/loans:s4"
   container_name: loans-ms
   ports:
      - "8090:8090"
   deploy:
      resources:
        limits:
          memory: 400m
   networks:
     - tykrohit

 cards:
   image: "tyedukondaluy/cards:s4"
   container_name: cards-ms
   ports:
     - "9000:9000"
   deploy:
     resources:
       limits:
         memory: 400m
   networks:
     - tykrohit
networks:
  tykrohit:
    driver: "bridge"
